<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101313">
  <title>KMS // Cabinet access</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101313;
      --panel: #181d1d;
      --line: #34403e;
      --text: #e8eee9;
      --muted: #9aa8a1;
      --accent: #d8ff61;
      --danger: #ff8f82;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 Arial, sans-serif;
    }
    main { width: min(100%, 420px); }
    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font: 700 12px/1.2 monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 10vw, 3.2rem);
      line-height: .98;
      letter-spacing: -.06em;
    }
    .intro { margin: 16px 0 28px; color: var(--muted); }
    form, .handoff {
      padding: 20px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font: 700 12px/1.2 monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .password-row { display: flex; gap: 8px; }
    input, button, a { min-height: 52px; border-radius: 2px; font: inherit; }
    input {
      width: 100%;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: #0f1313;
      color: var(--text);
      outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px #d8ff6133; }
    button, a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      padding: 0 18px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    #toggle { flex: 0 0 auto; background: #293230; color: var(--text); }
    #submit { width: 100%; margin-top: 16px; background: var(--accent); color: #101313; }
    button:disabled { cursor: wait; opacity: .55; }
    .message { min-height: 24px; margin: 12px 0 0; color: var(--danger); font-size: 14px; }
    .handoff { margin-top: 16px; }
    .handoff p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    #continue { width: 100%; background: #293230; color: var(--text); }
    #continue.ready { background: var(--accent); color: #101313; }
    .foot { margin: 20px 0 0; color: var(--muted); font: 12px/1.4 monospace; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">KMS / cabinet gateway</p>
    <h1>Unlock local access.</h1>
    <p class="intro">Authenticate with this cabinet first. Then continue to KMS Operating in your browser.</p>

    <form id="login-form">
      <label for="password">Cabinet password</label>
      <div class="password-row">
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button id="toggle" type="button" aria-label="Show password">Show</button>
      </div>
      <p id="message" class="message" role="alert" aria-live="polite"></p>
      <button id="submit" type="submit">Unlock cabinet</button>
    </form>

    <section class="handoff" aria-live="polite">
      <p id="handoff-copy">After local authentication, continue to the KMS Operating login.</p>
      <a id="continue" href="https://kms-opal.vercel.app/" aria-disabled="true">Continue to KMS Operating</a>
    </section>

    <p class="foot">Connected locally • ESP32 cabinet controller</p>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const password = document.querySelector('#password');
    const toggle = document.querySelector('#toggle');
    const submit = document.querySelector('#submit');
    const message = document.querySelector('#message');
    const continueLink = document.querySelector('#continue');
    const handoffCopy = document.querySelector('#handoff-copy');

    toggle.addEventListener('click', () => {
      const visible = password.type === 'text';
      password.type = visible ? 'password' : 'text';
      toggle.textContent = visible ? 'Show' : 'Hide';
      toggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      submit.disabled = true;
      submit.textContent = 'Checking…';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password.value })
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || !body.token) throw new Error(body.error || 'Login failed');
        // Keep the token local to this ESP origin for the next local UI phase.
        sessionStorage.setItem('kms_esp_session', body.token);
        handoffCopy.textContent = 'Cabinet unlocked. Continue to KMS Operating to sign in there.';
        continueLink.classList.add('ready');
        continueLink.removeAttribute('aria-disabled');
        submit.textContent = 'Cabinet unlocked';
      } catch (error) {
        message.textContent = error.message === 'locked' ? 'Too many attempts. Try again in 30 seconds.' : 'Incorrect password or cabinet unavailable.';
        submit.disabled = false;
        submit.textContent = 'Unlock cabinet';
      }
    });
  </script>
</body>
</html>
